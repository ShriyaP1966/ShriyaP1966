name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 18 * * *"   # daily, 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name "ShriyaP1966"
          git config user.email "shriyapatil1966@gmail.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution graph"; then
            git push
          fi
